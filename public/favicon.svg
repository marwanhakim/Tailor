<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="110" fill="#0f172a"/>
  <!-- Outer subtle gradient ring -->
  <rect x="20" y="20" width="472" height="472" rx="95" fill="none" stroke="#334155" stroke-width="8"/>
  
  <g transform="translate(256, 256)">
    <!-- Tailor Scissors in Gold/Emerald -->
    <circle cx="-60" cy="70" r="32" fill="none" stroke="#34d399" stroke-width="20"/>
    <circle cx="60" cy="70" r="32" fill="none" stroke="#34d399" stroke-width="20"/>
    
    <!-- Scissor Blades -->
    <path d="M -45 45 L 80 -100 L 95 -90 L -30 60 Z" fill="#6366f1"/>
    <path d="M 45 45 L -80 -100 L -95 -90 L 30 60 Z" fill="#818cf8"/>
    
    <!-- Center Pivot Gold Screw -->
    <circle cx="0" cy="0" r="16" fill="#fbbf24"/>
    
    <!-- Needle & Thread Loop in Emerald -->
    <path d="M -120 -80 C -40 -150 40 -150 120 -80" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round" stroke-dasharray="1 0"/>
    <circle cx="0" cy="-110" r="10" fill="#34d399"/>
  </g>
</svg>